# SMO-28 · The 22-question eval as a release gate (ADR-018). Run by hand before an agent or prompt release:
# it costs about $0.25 per run, so it only runs when started by hand, from main (the "eval" environment allows main only;
# required reviewers aren't available on this GitHub plan, and Alexander is the repository's only collaborator).
# Questions that failed because Google's endpoint did are run once more; a wrong answer is never retried.
name: eval gate

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  eval:
    runs-on: ubuntu-latest
    environment: eval
    env:
      # the same non-secret settings as agent/storegear/.env (set as variables of the "eval" environment)
      GOOGLE_GENAI_USE_VERTEXAI: "True"
      GOOGLE_CLOUD_PROJECT: storegear-prod-ag26
      GOOGLE_CLOUD_LOCATION: ${{ vars.GOOGLE_CLOUD_LOCATION }}
      STOREGEAR_MODEL: ${{ vars.STOREGEAR_MODEL }}
      STOREGEAR_THINKING: ${{ vars.STOREGEAR_THINKING }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen

      - name: Sign in to Google Cloud as sg-agent (no keys; the identity the eval uses on the laptop)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: sg-agent@storegear-prod-ag26.iam.gserviceaccount.com

      - name: Eval of the deployed agent
        run: uv run python eval/run_eval.py --remote --out results/first.json

      - name: Questions that failed on availability
        id: retry
        run: echo "qids=$(uv run python eval/gate.py --retry-list results/first.json)" >> "$GITHUB_OUTPUT"

      - name: Run them once more
        if: steps.retry.outputs.qids != ''
        run: uv run python eval/run_eval.py --remote --only ${{ steps.retry.outputs.qids }} --out results/rerun.json

      - name: Gate (every metric >= baseline - 0.1)
        run: uv run python eval/gate.py results/first.json $( [ -f results/rerun.json ] && echo results/rerun.json )

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: results/
