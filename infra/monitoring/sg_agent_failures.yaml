# SMO-25 (ADR-019) · answers that failed (AGENT_FAILED lines), by agent
name: sg_agent_failures
description: Agent failures logged by sg-api, by agent
filter: resource.type="cloud_run_revision" AND resource.labels.service_name="sg-api" AND jsonPayload.event="AGENT_FAILED"
labelExtractors:
  agent: EXTRACT(jsonPayload.agent)
metricDescriptor:
  metricKind: DELTA
  valueType: INT64
  unit: "1"
  labels:
  - key: agent
