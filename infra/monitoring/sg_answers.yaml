# SMO-25 (ADR-019) · one count per ANSWER line, by agent and by guardrail outcome
name: sg_answers
description: Answers served by sg-api (ANSWER log lines), by agent and guardrail outcome
filter: resource.type="cloud_run_revision" AND resource.labels.service_name="sg-api" AND jsonPayload.event="ANSWER"
labelExtractors:
  agent: EXTRACT(jsonPayload.agent)
  guard: EXTRACT(jsonPayload.guard)
metricDescriptor:
  metricKind: DELTA
  valueType: INT64
  unit: "1"
  labels:
  - key: agent
  - key: guard
